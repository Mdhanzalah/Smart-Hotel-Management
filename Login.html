<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart PALACE</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h1>Smart <span>PALACE</span></h1>
            <p class="subtitle">LUXURY HOTEL & RESORT</p>

            <h2>Admin Login</h2>
            <p class="description">Sign in to manage hotel bookings</p>

            <form id="loginForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">LOGIN</button>
                <p id="message"></p>
            </form>

            <a href="index.html" class="back-link">
                ← Back to Website
            </a>
        </div>
    </div>

    <script src="Login.js"></script>
</body>
</html>
